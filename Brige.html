<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page-mainB</title>
</head>
<body>
    <h1>это главная страница для бриджинга</h1>

    <table>
        <caption>Список курсов</caption>
        <thead>
            <tr>
                <th>Предмет</th>
                <th>Уроков</th>
                <th>Уровень</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTML</td>
                <td>40</td>
                <td>Начальный</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>55</td>
                <td>Начальный</td>
            </tr>
            <tr>
                <td>JavaScript</td>
                <td>120</td>
                <td>Начальный</td>
            </tr>
        </tbody>
    ></table>

    
    <style>
        table {
            border-collapse: collapse; /* объединяет двойные рамки в одну */
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }

        body { background-color: gray; }

    </style>
